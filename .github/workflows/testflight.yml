name: TestFlight

# Cada rama larga tiene su público:
#
#   staging → grupo «Equipo»   (interno, solo nosotros, sin revisión de Apple)
#   main    → grupo «Testers»  (externo, el link público)
#
# Y desde la pestaña Actions se puede subir cualquier rama eligiendo a dónde va,
# que es cómo se prueba una feature sin que le llegue a nadie de afuera.
on:
  push:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      destino:
        description: A qué grupo va el build
        type: choice
        default: interno
        options: [interno, externo]

concurrency:
  # Por rama, y sin cancelar: un build a medio subir deja a App Store Connect
  # con un número usado y sin binario.
  group: testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  subir:
    runs-on: macos-latest
    # Compilar React Native desde cero en un runner de Apple no baja de 40 min.
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Elegir el Xcode más nuevo
        # El proyecto pide Swift 6.2 (Xcode 26). La imagen del runner trae varias
        # versiones y la seleccionada por defecto puede ser anterior.
        run: |
          XCODE=$(find /Applications -maxdepth 1 -name 'Xcode_*.app' | sort -V | tail -1)
          echo "==> $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - run: npm ci

      # Lo barato primero: no tiene sentido ocupar tres cuartos de hora de runner
      # para descubrir al final que había un error de tipos.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - name: Guardar la clave de App Store Connect
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          RUTA="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s' "$ASC_KEY_P8" > "$RUTA"
          chmod 600 "$RUTA"
          # $RUNNER_TEMP se borra al terminar el job: la clave no queda en la
          # imagen ni en el árbol del repo.
          echo "ASC_KEY_PATH=$RUTA" >> "$GITHUB_ENV"

      - name: Elegir el grupo
        env:
          DESTINO: ${{ inputs.destino }}
          RAMA: ${{ github.ref_name }}
        run: |
          # En un push no hay input: manda la rama.
          destino="${DESTINO:-}"
          if [ -z "$destino" ]; then
            if [ "$RAMA" = "main" ]; then destino=externo; else destino=interno; fi
          fi
          if [ "$destino" = externo ]; then
            echo "GRUPO=Testers" >> "$GITHUB_ENV"
            echo "INTERNO=" >> "$GITHUB_ENV"
          else
            echo "GRUPO=Equipo" >> "$GITHUB_ENV"
            echo "INTERNO=--internal" >> "$GITHUB_ENV"
          fi
          echo "==> $destino"

      - name: Generar el proyecto nativo
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_KEY }}
        run: |
          # Sin PARA_SIMULADOR: para dispositivo van los frameworks precompilados,
          # que son varias veces más rápidos de compilar.
          npx expo prebuild --platform ios --no-install
          cd ios && pod install

      - name: Numerar el build
        # Fecha y hora en UTC: siempre sube, nunca repite, y se lee de un vistazo
        # en App Store Connect. El número de corrida no sirve porque se reinicia
        # si se recrea el workflow.
        run: echo "BUILD_NUMBER=$(date -u +%Y%m%d%H%M)" >> "$GITHUB_ENV"

      - name: Archivar y subir
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_KEY }}
        run: npm run testflight

      - name: Repartir a los testers
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          RAMA: ${{ github.ref_name }}
          ASUNTO: ${{ github.event.head_commit.message }}
        run: |
          # Solo la primera línea del mensaje: el cuerpo del commit no le dice
          # nada a quien abre TestFlight.
          NOTAS="$(printf '%s' "$ASUNTO" | head -1)"
          [ -z "$NOTAS" ] && NOTAS="Build de $RAMA"
          ARGS=(--build-number "$BUILD_NUMBER" --group "$GRUPO" --notes "$NOTAS ($RAMA)")
          [ -n "$INTERNO" ] && ARGS+=("$INTERNO")
          node scripts/testflight-distribute.mjs "${ARGS[@]}"
